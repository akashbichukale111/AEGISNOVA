name: AEGISNOVA Continuous Integration & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Build, Smoke Test & Security Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run AEGISNOVA Verification Suite (102+ Checks)
      run: npm test

    - name: Next.js Production Build
      run: npm run build
      env:
        NODE_ENV: production
