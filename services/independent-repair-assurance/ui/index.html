<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGISNOVA · Independent Repair Assurance</title>
<style>:root{--bg:#0e1116;--p:#161b22;--b:#262d38;--t:#e6edf3;--m:#8b98a8;--a:#38bdf8;--bad:#f87171;--warn:#fbbf24;--ok:#34d399}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,sans-serif}header{padding:14px 20px;border-bottom:1px solid var(--b);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0;color:var(--a)}header small{color:var(--m)}nav{display:flex;gap:4px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--b)}
nav button,.btn{background:var(--p);color:var(--t);border:1px solid var(--b);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}nav button[aria-selected=true],.btn.pri{border-color:var(--a);color:var(--a)}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--a)}
main{padding:16px 20px;max-width:1100px}section{display:none}section.on{display:block}label{display:block;margin:10px 0 4px;color:var(--m)}textarea,input,select{width:100%;background:#0b0e13;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px;font:12px ui-monospace,monospace}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border-bottom:1px solid var(--b);padding:6px 8px;text-align:left;vertical-align:top}.tag{padding:1px 8px;border-radius:99px;border:1px solid var(--b);font-size:12px}
.PASSED,.VERIFIED,.VALID,.ACTIVE,.LOW,.OK,.NO_BREAK_FOUND_WITHIN_SCOPE,.CONFIRMED{color:var(--ok)}.FAILED,.REJECTED,.HIGH,.CRITICAL,.BREAK_FOUND,.INVALIDATED,.EXPIRED,.DISCREPANCIES{color:var(--bad)}.NOT_RUN,.BLOCKED,.UNKNOWN,.NEEDS_HUMAN_REVIEW,.MODERATE,.MEDIUM,.WARN,.INCONCLUSIVE,.NO_WARRANT,.VERIFIED_WITH_WARNINGS,.AGING,.REQUIRES_REVALIDATION,.NEEDS_REVIEW{color:var(--warn)}
pre{background:#0b0e13;border:1px solid var(--b);padding:10px;overflow:auto;max-height:340px;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.demo{color:var(--warn)}</style></head><body>
<header><h1>AEGISNOVA · Independent Repair Assurance</h1><small>Workstream 04 · standalone · not merged into AEGISNOVA</small></header>
<nav role="tablist" id="nav"></nav><main>
<section id="s0"><p class="demo">DEMO fixtures only. Results below come from real executions recorded by the server; NOT_RUN / BLOCKED are never shown as passed.</p>
<label for="repo">Repository (DEMO fixture)</label><select id="repo"></select><label for="base">Declared base (tree hash)</label><input id="base" readonly>
<label for="demo">Load DEMO patch</label><select id="demo"></select><label for="patch">Patch / diff</label><textarea id="patch" rows="10"></textarea>
<label for="claim">Repair claim</label><input id="claim" value="Fix division by zero to raise ValueError"><label><input type="checkbox" id="ct" style="width:auto"> Developer claims "tests passed" (will be verified, not trusted)</label>
<label for="warrant">Warrant JSON (optional)</label><textarea id="warrant" rows="3" placeholder="empty = NO_WARRANT"></textarea><label><input type="checkbox" id="dw" style="width:auto"> Generate DEMO test-only warrant</label>
<div class="row"><button class="btn pri" id="go">Run assurance</button><span id="msg"></span></div></section>
<section id="s1"></section><section id="s2"></section><section id="s3"></section><section id="s4"></section><section id="s5"></section><section id="s6"></section><section id="s7"></section><section id="s8"></section></main>
<script>
const T=["Workspace","Run Timeline","Patch Breaker","Reality Audit","Warrant Checker","Repair Proof","Residual Risk","Living Warranty","Settings/Health"];let R=null,W=null;
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])),tag=s=>`<span class="tag ${esc(s)}">${esc(s)}</span>`;
const nav=$("nav");T.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.setAttribute("role","tab");b.onclick=()=>show(i);nav.append(b)});
function show(i){[...nav.children].forEach((b,j)=>b.setAttribute("aria-selected",i==j));for(let j=0;j<9;j++)$("s"+j).classList.toggle("on",i==j);if(i==8)health();}
const tbl=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")||`<tr><td colspan=${h.length}>none</td></tr>`}</table>`;
const api=async(p,o)=>{const r=await fetch(p,o);const t=await r.text();try{return JSON.parse(t)}catch{return t}};
function render(){if(!R){return}
$("s1").innerHTML=`<h3>${tag(R.status)} ${esc(R.reason)}</h3>`+tbl(["Stage","Status","Detail","At"],R.stages.map(s=>[s.stage,tag(s.status),esc(s.detail),esc(s.at)]));
$("s2").innerHTML=`<h3>Patch Breaker ${tag(R.breaker.status)}</h3>`+tbl(["ID","Severity","Rule","Path","Evidence"],R.breaker.findings.map(f=>[f.id,tag(f.severity),f.rule,esc(f.path),esc(f.evidence)]))+"<h4>Attempted checks</h4>"+tbl(["ID","Check","Outcome","Limitation"],R.breaker.checks.map(c=>[c.id,esc(c.description),tag(c.outcome),esc(c.limitation)]));
const ts=["before","after"].map(k=>R.tests[k]).filter(Boolean);
$("s3").innerHTML=`<h3>Reality Audit ${tag(R.audit.status)}</h3>`+tbl(["ID","Severity","Claimed","Observed"],R.audit.findings.map(f=>[f.id,tag(f.severity),esc(JSON.stringify(f.claimed)),esc(f.observed)]))+"<h4>Test execution (actual)</h4>"+tbl(["Run","Status","Exit","Duration","Summary / reason"],["before","after"].filter(k=>R.tests[k]).map(k=>{const v=R.tests[k];return [k,tag(v.status),esc(v.exit_code),esc(v.duration_s),esc(JSON.stringify(v.summary)||v.reason)]}));
$("s4").innerHTML=`<h3>Warrant ${tag(R.warrant.status)} ${R.warrant_is_demo?'<span class="demo">DEMO test-only</span>':''}</h3><pre>${esc(JSON.stringify(R.warrant,null,1))}</pre><p>A valid warrant means authorized within scope; it does not mean the patch is safe.</p>`;
$("s5").innerHTML=`<h3>Repair Proof</h3><p>${esc(R.proof.proof_id)}<br>hash: <code>${esc(R.proof.proof_hash)}</code><br>${esc(R.proof.attestation.note)}</p><div class="row"><a class="btn" href="/v1/runs/${R.run_id}/proof" download="${R.run_id}_proof.json">Download JSON</a><a class="btn" href="/v1/runs/${R.run_id}/proof/report" download="${R.run_id}_report.txt">Download report</a></div><pre>${esc(JSON.stringify(R.proof.evidence,null,1))}</pre>`;
$("s6").innerHTML=`<h3>Residual risk ${tag(R.risk.overall)}</h3><p>${esc(R.risk.recommended_action)}</p>`+tbl(["Factor","Level","Rationale"],R.risk.factors.map(f=>[f.factor,tag(f.level),esc(f.rationale)]))+`<p>${esc(R.risk.note)}</p><h4>Limitations</h4><ul>${R.limitations.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
wrender();}
async function wrender(){const el=$("s7");if(!R||!R.warranty_id){el.innerHTML="<p>No warranty: only created for VERIFIED / VERIFIED_WITH_WARNINGS runs.</p>";return}
W=await api("/v1/warranty/"+R.warranty_id);el.innerHTML=`<h3>${tag(W.state)} <small>${esc(W.warranty_id)}</small></h3><p>Proof ${esc(W.proof_id)} · expires ${esc(W.expires)} · last revalidated ${esc(W.last_revalidated)}<br>Covered: ${esc(Object.keys(W.covered_files).join(", "))}<br>${esc(W.disclaimer)}</p><div class="row"><button class="btn" id="wc">Check now</button><button class="btn" id="wr">Manual revalidate (re-runs tests)</button><select id="wt"><option value="">add trigger…</option><option>dependency_advisory</option><option>base_branch_change</option><option>test_change</option><option>policy_update</option></select></div>`+tbl(["At","From","To","Reason"],W.history.map(h=>[esc(h.at),esc(h.from),esc(h.to),esc(h.reason)]));
$("wc").onclick=async()=>{const t=$("wt").value;await api("/v1/warranty/"+W.warranty_id+"/check",{method:"POST",body:JSON.stringify({repo:"@snapshot",triggers:t?[t]:[]})});wrender()};$("wr").onclick=async()=>{await api("/v1/warranty/"+W.warranty_id+"/revalidate",{method:"POST",body:JSON.stringify({repo:"@snapshot"})});wrender()}}
async function health(){const h=await api("/v1/health");$("s8").innerHTML=`<h3>Runner / sandbox</h3><pre>${esc(JSON.stringify(h,null,1))}</pre><p>Runtime execution is ${h.runtime_execution_enabled?"ENABLED (process-level, not a container)":"DISABLED: tests report BLOCKED/NOT_RUN. Start with IRA_ALLOW_LOCAL_EXEC=1 to opt in."}</p>`}
(async()=>{const rp=await api("/v1/repos");$("repo").innerHTML=rp.repos.map(r=>`<option value="${esc(r.name)}" data-b="${r.base_sha}">${esc(r.name)} (DEMO)</option>`).join("");const sb=()=>$("base").value=$("repo").selectedOptions[0].dataset.b;$("repo").onchange=sb;sb();
const d=await api("/v1/demo");$("demo").innerHTML="<option value=''>— choose —</option>"+Object.keys(d.patches).map(k=>`<option>${esc(k)}</option>`).join("");$("demo").onchange=()=>$("patch").value=d.patches[$("demo").value]||"";
$("go").onclick=async()=>{$("msg").textContent="running…";let w=null;if($("warrant").value.trim()){try{w=JSON.parse($("warrant").value)}catch{$("msg").textContent="warrant is not valid JSON";return}}
const o=await api("/v1/runs",{method:"POST",body:JSON.stringify({repo:$("repo").value,base_sha:$("base").value,patch:$("patch").value,claim:{summary:$("claim").value,tests_passed:$("ct").checked||null},warrant:w,demo_warrant:$("dw").checked})});
if(o.error){$("msg").textContent=o.error.code+": "+o.error.message;return}R=o;$("msg").textContent="done: "+R.status;render();show(1)};show(0)})();
</script></body></html>
